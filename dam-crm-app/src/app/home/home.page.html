<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Blank
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <h3>Listado de Clientes</h3>
  <ion-list>
    @for (proveedor of proveedores; track proveedor.id) {
      <ion-item-sliding>
        <ion-item>
          <ion-label>
            <h2>{{ proveedor.name }}</h2>
            <p>{{ proveedor.unidad }}</p>
          </ion-label>
        </ion-item>
      </ion-item-sliding>
    }
  </ion-list>
</ion-content>
