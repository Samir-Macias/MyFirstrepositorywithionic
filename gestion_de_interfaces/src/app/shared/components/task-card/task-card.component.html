<article class="task-card" [class.task-card--completed]="task().status === 'COMPLETED'">
  <button
    class="task-card__check"
    [class.task-card__check--checked]="task().status === 'COMPLETED'"
    type="button"
    [attr.aria-label]="
      task().status === 'COMPLETED'
        ? 'Marcar como pendiente: ' + task().title
        : 'Marcar como completada: ' + task().title
    "
    [attr.aria-pressed]="task().status === 'COMPLETED'"
    (click)="completionToggled.emit(task().id)"
  >
    @if (task().status === 'COMPLETED') {
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="m5 10 3.2 3.2L15.5 6" />
      </svg>
    }
  </button>

  <div class="task-card__body">
    <div class="task-card__heading">
      <h3 class="task-card__title">{{ task().title }}</h3>
      <span
        class="task-card__priority"
        [class.task-card__priority--high]="task().priority === 'HIGH'"
        [class.task-card__priority--medium]="task().priority === 'MEDIUM'"
      >
        {{ task().priority === 'HIGH' ? 'Alta' : task().priority === 'MEDIUM' ? 'Media' : 'Baja' }}
      </span>
    </div>
    <p class="task-card__description">{{ task().description }}</p>
    <div class="task-card__meta">
      <div class="task-card__tags" aria-label="Etiquetas">
        @for (tag of task().tags; track tag) {
          <span class="task-card__tag">{{ tag }}</span>
        }
      </div>
      <div class="task-card__assignee">
        <span class="task-card__avatar" aria-hidden="true">{{ task().assignedUserInitials }}</span>
        <span class="task-card__assignee-name">{{ task().assignedUserName }}</span>
      </div>
      <span class="task-card__due">{{ task().dueLabel }}</span>
    </div>
  </div>
</article>
